name: XUL Kernel CI

on:
  push:
    paths:
      - "kernel/xul/**"
      - ".github/workflows/xul.yml"
  pull_request:
    paths:
      - "kernel/xul/**"
      - ".github/workflows/xul.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xul:
    name: XUL tests and architecture links
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install AArch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu xorriso qemu-system-x86
      - name: Audit source layout
        run: make -C kernel/xul source-audit
      - name: Run host tests
        run: make -C kernel/xul test
      - name: Build x86_64 ELF
        run: make -C kernel/xul x86_64-build
      - name: Build AArch64 ELF
        run: make -C kernel/xul arm64-build CC_ARM64=aarch64-linux-gnu-gcc LD_ARM64=aarch64-linux-gnu-ld
      - name: Build x86_64 bootable ISO
        run: make -C kernel/xul limine-image-x86_64
      - name: Build AArch64 bootable ISO
        run: make -C kernel/xul limine-image-arm64 CC_ARM64=aarch64-linux-gnu-gcc LD_ARM64=aarch64-linux-gnu-ld
      - name: Smoke boot x86_64 ISO in QEMU
        run: sh kernel/xul/boot/limine/qemu-smoke.sh kernel/xul/.build/xul-x86_64.iso kernel/xul/.build/xul-qemu-smoke.log
      - name: Publish kernel images
        uses: actions/upload-artifact@v4
        with:
          name: xul-elf-images
          path: |
            kernel/xul/.build/x86_64/xul.elf
            kernel/xul/.build/arm64/xul.elf
            kernel/xul/.build/xul-x86_64.iso
            kernel/xul/.build/xul-arm64.iso
          if-no-files-found: error
