name: XIUL Kernel CI

on:
  push:
    paths:
      - "kernel/xiul/**"
      - ".github/workflows/xiul.yml"
  pull_request:
    paths:
      - "kernel/xiul/**"
      - ".github/workflows/xiul.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xiul:
    name: XIUL tests and architecture links
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      sparse-checkout: |
        /.github/workflows/xiul.yml
        /.github/workflows/xiul-source-audit.yml
        /kernel/xiul/Makefile
        /kernel/xiul/xiul.toml
        /kernel/xiul/README.md
        /kernel/xiul/ARCHITECTURE.md
        /kernel/xiul/UPSTREAM-SOURCES.txt
        /kernel/xiul/INTEGRATION-STATUS.md
        /kernel/xiul/boot/**
        /kernel/xiul/core/**
        /kernel/xiul/include/**
        /kernel/xiul/io/**
        /kernel/xiul/compat/**
        /kernel/xiul/bsd/**
        /kernel/xiul/platform/**
        /kernel/xiul/tests/**
        /kernel/xiul/mach/README.md
        /kernel/xiul/linux/README
        /kernel/xiul/freebsd/README.md
      sparse-checkout-cone-mode: false
      - name: Install AArch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Audit source layout
        run: make -C kernel/xiul source-audit
      - name: Run host tests
        run: make -C kernel/xiul test
      - name: Build x86_64 ELF
        run: make -C kernel/xiul x86_64-build
      - name: Build AArch64 ELF
        run: make -C kernel/xiul arm64-build CC_ARM64=aarch64-linux-gnu-gcc LD_ARM64=aarch64-linux-gnu-ld
      - name: Publish kernel images
        uses: actions/upload-artifact@v4
        with:
          name: xiul-elf-images
          path: |
            kernel/xiul/.build/x86_64/xiul.elf
            kernel/xiul/.build/arm64/xiul.elf
          if-no-files-found: error
