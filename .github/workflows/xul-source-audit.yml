name: XUL source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Run XUL source audit
        run: make -C kernel/xul source-audit
      - name: Build and test XUL core
        run: make -C kernel/xul test
      - name: Freestanding-build and relocatably link XUL core for x86_64 and AArch64
        run: make -C kernel/xul arch-build
