# One-shot migration runner. It only triggers when the migration script itself changes.
name: XUL source-tree rebrand

on:
  push:
    branches: [main]
    paths:
      - "scripts/rebrand-xul.sh"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the XUL source migration
        run: bash scripts/rebrand-xul.sh
      - name: Commit the migration
        run: |
          if git diff --quiet; then
            echo "The source tree is already branded XUL."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand XIUL source tree and APIs to XUL"
          git push origin HEAD:main
