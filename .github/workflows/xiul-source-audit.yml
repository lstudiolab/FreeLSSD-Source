name: XIUL source audit

on:
  push:
    paths:
      - "kernel/xiul/**"
      - ".github/workflows/xiul-source-audit.yml"
  pull_request:
    paths:
      - "kernel/xiul/**"
      - ".github/workflows/xiul-source-audit.yml"
  workflow_dispatch:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run XIUL source audit
        run: make -C kernel/xiul source-audit
      - name: Build and test XIUL core
        run: make -C kernel/xiul test
