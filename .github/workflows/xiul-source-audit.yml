name: XIUL source audit

on:
  push:
    paths:
      - "kernel/xiul/**"
      - ".github/workflows/xiul-source-audit.yml"
  pull_request:
    paths:
      - "kernel/xiul/**"
      - ".github/workflows/xiul-source-audit.yml"
  workflow_dispatch:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Run XIUL source audit
        run: make -C kernel/xiul source-audit
      - name: Build and test XIUL core
        run: make -C kernel/xiul test
      - name: Cross-compile x86_64 and AArch64 platform layers
        run: make -C kernel/xiul arch-build
